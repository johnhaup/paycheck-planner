# Protects the Pay date screen: assigned vs available bills, toggling paid,
# Mark all paid with undo, and the Pro gate on the change-pay-amount sheet.
appId: com.johnhaup.paycheckplanner
name: pay-date-detail
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- tapOn:
    text: "[A-Z]{3}, [0-9]+, .*"
    index: 0
- extendedWaitUntil:
    visible: "This paycheck"
    timeout: 10000
- assertVisible: "Left over"
- assertVisible: "Available"
- takeScreenshot: pay-date-detail

# Toggle one bill paid and back
- tapOn:
    text: "Mark .* paid"
    index: 0
- assertVisible: "Mark .* unpaid"
- tapOn:
    text: "Mark .* unpaid"
    index: 0

# Mark all paid, then undo from the toast. The toast dismisses itself after 4 s,
# so nothing may sit between seeing Undo and tapping it (HAU-102). Even then,
# under gate load Maestro's own tap and lookup can outlast the toast: in the
# 09:45 gate the Undo tap landed 4.6 s after Mark all paid, on nothing (HAU-112).
# When Undo missed, every bill is paid and "Mark all paid" is hidden: unpay one
# bill and try the pair again, up to 3 times. A broken Undo still fails below.
- tapOn: "Mark all paid"
- extendedWaitUntil:
    visible: "Undo"
    timeout: 15000
- tapOn: "Undo"
- repeat:
    times: 3
    while:
      notVisible: "Mark all paid"
    commands:
      - tapOn:
          text: "Mark .* unpaid"
          index: 0
      - extendedWaitUntil:
          visible: "Mark all paid"
          timeout: 15000
      - tapOn: "Mark all paid"
      - extendedWaitUntil:
          visible: "Undo"
          timeout: 15000
      - tapOn: "Undo"
- extendedWaitUntil:
    visible: "Mark all paid"
    timeout: 10000
- takeScreenshot: pay-date-undone

# Changing this paycheck's pay amount is Pro (HAU-69): the tap opens the paywall
# instead of the form sheet while free
- tapOn:
    text: "Change .* pay amount for this paycheck"
    index: 0
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- takeScreenshot: pay-amount-paywall
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Mark all paid"
    timeout: 10000

- tapOn: "Back"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
