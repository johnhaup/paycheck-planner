# Protects the Income tab: adding the first source through the form (free),
# the summary tiles and source list, editing a source, and the Pro gate on a
# second source (HAU-69): the FAB carries the PRO badge and opens the paywall.
appId: com.johnhaup.paycheckplanner
name: income
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000

# Add the first source (weekly) from the Welcome screen; free tier allows one
- tapOn: "Add income source"
- extendedWaitUntil:
    visible: "e.g. Acme Corp"
    timeout: 10000
- tapOn: "e.g. 2500.00"
- inputText: "1500"
- tapOn: "e.g. Acme Corp"
- inputText: "QA Payroll"
- pressKey: Enter
- tapOn: "Weekly"
- scrollUntilVisible:
    element: "Add Income Source"
- tapOn: "Add Income Source"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Per month"
    timeout: 10000
- assertVisible: "Next payday"
- assertVisible: ".*QA Payroll.*"
- takeScreenshot: income-added

# Edit it
- tapOn: ".*QA Payroll.*"
- extendedWaitUntil:
    visible: "Update Income Source"
    timeout: 10000
- tapOn: "QA Payroll"
- inputText: " Co"
- pressKey: Enter
- scrollUntilVisible:
    element: "Update Income Source"
- tapOn: "Update Income Source"
- extendedWaitUntil:
    visible: ".*QA Payroll Co.*"
    timeout: 10000

# A second source is Pro: the FAB folds the badge into its label and opens the paywall
- assertVisible: "Add income source · PRO"
- takeScreenshot: income-fab-pro
- tapOn: "Add income source · PRO"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- assertVisible: "Restore Purchases"
- tapOn: "Close"
- extendedWaitUntil:
    visible: ".*QA Payroll Co.*"
    timeout: 10000

# The source shows up as paychecks
- openLink: paycheck-planner://
- extendedWaitUntil:
    visible: "[A-Z]{3}, [0-9]+, QA Payroll Co.*"
    timeout: 10000
