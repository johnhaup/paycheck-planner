# The income journey: adding the first source through the form (free), the summary
# tiles and source list, editing a source, the Pro gate on a second source (HAU-69:
# the FAB carries the PRO badge and opens the paywall), the form's Close button, and
# the source turning up as paychecks.
appId: com.johnhaup.paycheckplanner
name: income
---
- launchApp:
    clearState: true
    arguments:
      "--initialUrl": ${METRO_URL}
      "-EXDevMenuShowsAtLaunch": "NO"
      "-EXDevMenuShowFloatingActionButton": "NO"
      "-EXDevMenuIsOnboardingFinished": "YES"
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000

# The form's Close (X) leaves without saving (HAU-538)
- tapOn: "Add income source"
- extendedWaitUntil:
    visible: "e.g. Acme Corp"
    timeout: 10000
- tapOn: "e.g. Acme Corp"
- inputText: "Discard me"
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "e.g. Acme Corp"
    timeout: 10000
- assertVisible: "Try with sample data"
- assertNotVisible: ".*Discard me.*"

# Add the first source (weekly) from the Welcome screen; free tier allows one
# (the form opens empty again after the Close above)
- tapOn: "Add income source"
- extendedWaitUntil:
    visible: "e.g. Acme Corp"
    timeout: 10000
# A refused save marks the field, focuses it and keeps the header clear (HAU-772):
# the message sits under the field, typing into it clears the message
- scrollUntilVisible:
    element: "Add income source"
- tapOn: "Add income source"
- extendedWaitUntil:
    visible: "Name is required."
    timeout: 10000
- assertVisible: "Income source"
- assertVisible: "Close"
- inputText: "QA Payroll"
- assertNotVisible: "Name is required."
- pressKey: Enter
- scrollUntilVisible:
    element: "Add income source"
- tapOn: "Add income source"
- extendedWaitUntil:
    visible: "Enter a valid pay amount."
    timeout: 10000
- assertVisible: "Close"
- inputText: "1500"
- assertNotVisible: "Enter a valid pay amount."
# Drop the number pad without touching a key: a label on iOS, back on Android
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "(?i)pay frequency"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Weekly"
- scrollUntilVisible:
    element: "Add income source"
- tapOn: "Add income source"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- tapOn: "Income"
- extendedWaitUntil:
    visible: "Per month"
    timeout: 10000
- assertVisible: "Next payday"
- assertVisible: ".*QA Payroll.*"

# Edit it
- tapOn: ".*QA Payroll.*"
- extendedWaitUntil:
    visible: "Update income source"
    timeout: 10000
- tapOn: "QA Payroll"
- inputText: " Co"
- pressKey: Enter
- scrollUntilVisible:
    element: "Update income source"
- tapOn: "Update income source"
- extendedWaitUntil:
    visible: ".*QA Payroll Co.*"
    timeout: 10000

# A second source is Pro: the FAB folds the badge into its label and opens the paywall
- assertVisible: "Add income source · PRO"
- takeScreenshot: income
- tapOn: "Add income source · PRO"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- assertVisible: "Restore purchases"
- tapOn: "Close"
- extendedWaitUntil:
    visible: ".*QA Payroll Co.*"
    timeout: 10000

# The source shows up as paychecks
- tapOn: "Paychecks"
- extendedWaitUntil:
    visible: "[A-Z]{3}, [0-9]+, QA Payroll Co.*"
    timeout: 10000

# Deleting the last source and coming back to Paychecks shows Welcome, no crash
# (HAU-905: the tab return jumped to scrollToIndex(-1)). iOS only: the swipe is by
# points, measured on an iPhone 17 Pro.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Income"
      - extendedWaitUntil:
          visible: ".*QA Payroll Co.*"
          timeout: 10000
      - swipe:
          start: 340, 339
          end: 80, 339
      - waitForAnimationToEnd
      - tapOn: "Delete"
      - extendedWaitUntil:
          visible: "No income yet"
          timeout: 10000
      - tapOn: "Paychecks"
      - extendedWaitUntil:
          visible: "Try with sample data"
          timeout: 10000
      - assertNotVisible: "Render Error"
      - assertVisible: "Add income source"
