# Protects the pay date screen's navigation bar in the longest "Mark all paid" translation (HAU-326):
# Malayalam's 33-character label is capped at 40% of the bar and shrinks to fit, so the title
# "ശമ്പള തീയതി" (Pay Date) stays in the bar. Before the fix the button took about two-thirds of
# the bar and the title was gone. The size and whole-letters check is a screenshot
# (pay-date-header-ml); the position check below fails when the title is pushed out.
# pay-date-header.yaml covers English at the largest accessibility text size.
appId: com.johnhaup.paycheckplanner
tags: [ios]   # the language comes from an iOS launch argument
name: pay-date-header-locale
---
- launchApp:
    clearState: true
    arguments:
      "-AppleLanguages": "(ml)"
# "Try with sample data"
- extendedWaitUntil:
    visible: "സാമ്പിൾ ഡാറ്റ ഉപയോഗിച്ച് പരീക്ഷിക്കുക"
    timeout: 60000
- tapOn: "സാമ്പിൾ ഡാറ്റ ഉപയോഗിച്ച് പരീക്ഷിക്കുക"
# The first paycheck card; its label starts with the Malayalam month, so match the source name
- extendedWaitUntil:
    visible:
      text: ".*[0-9]+, Brightline Co\\., .*"
      index: 0
    timeout: 15000
- tapOn:
    text: ".*[0-9]+, Brightline Co\\., .*"
    index: 0
# "Mark all paid"
- extendedWaitUntil:
    visible: "എല്ലാം അടച്ചതായി അടയാളപ്പെടുത്തുക"
    timeout: 15000
- assertVisible:
    text: "ശമ്പള തീയതി"
    leftOf: "എല്ലാം അടച്ചതായി അടയാളപ്പെടുത്തുക"
- takeScreenshot: pay-date-header-ml

# The button still works: Undo toast ("പഴയപടിയാക്കുക"), the button leaves, the title stays
- tapOn: "എല്ലാം അടച്ചതായി അടയാളപ്പെടുത്തുക"
- extendedWaitUntil:
    visible: "പഴയപടിയാക്കുക"
    timeout: 5000
- extendedWaitUntil:
    notVisible: "എല്ലാം അടച്ചതായി അടയാളപ്പെടുത്തുക"
    timeout: 15000
- assertVisible: "ശമ്പള തീയതി"
