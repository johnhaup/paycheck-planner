# The Pro journey on the mock store (launch argument -proStoreMock, src/services/proStoreMock.ts):
# Restore with nothing bought, Buy, unlocked; after a relaunch the account still owns Pro and the
# Pro features open (the 12-month chart, a paycheck's own pay amount, another income source); a
# refund (-proStoreMockRevoke) locks it again and Restore finds nothing.
# The free tier's gates are steps in the other flows. Never tap Buy on a launch without
# -proStoreMock: the real sandbox sign-in alert would break every later flow.
# The paywall is reached the way a user reaches it (the Go Pro card, the Settings row): no deep
# links, so a freshly erased simulator's "Open in Paycheck Planner?" alert never comes up.
appId: com.johnhaup.paycheckplanner
tags: [ios]   # the mock store is switched on by an iOS launch argument (Android reads every launch flag as off)
name: pro
---
# Start from an empty mock account (revoke) whatever an earlier run left behind
- launchApp:
    clearState: true
    arguments:
      "-proStoreMock": true
      "-proStoreMockRevoke": true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- tapOn: "Go Pro to plan a full year ahead"
- extendedWaitUntil:
    visible: "Buy for \\$4\\.99"
    timeout: 20000
# Nothing bought yet: Restore finds nothing and the paywall stays locked
- tapOn: "Restore Purchases"
- extendedWaitUntil:
    visible: "No Pro purchase found for this account"
    timeout: 10000
- tapOn: "Buy for \\$4\\.99"
- extendedWaitUntil:
    visible: "Pro is unlocked"
    timeout: 20000
- takeScreenshot: pro-unlocked
- tapOn: "Done"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000

# Still Pro after a kill and relaunch (the launch check asks the mock account again)
- launchApp:
    stopApp: true
    arguments:
      "-proStoreMock": true
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 60000

# The 12-month chart (HAU-316): a tap three months ahead jumps the list there, and
# "Go to this month" returns to the current paycheck
- assertNotVisible: "Go Pro to plan a full year ahead"
- copyTextFrom: ".* · left over"
- evalScript: ${output.thisMonth = maestro.copiedText}
- tapOn:
    text: "[A-Za-z]+( [0-9]{4})?, \\$[^,]+ left"
    index: 2
- extendedWaitUntil:
    visible: "Go to this month"
    timeout: 15000
- waitForAnimationToEnd
- copyTextFrom: ".* · left over"
- evalScript: ${output.jumpedMonth = maestro.copiedText.split(' · ')[0]}
- assertTrue: ${maestro.copiedText != output.thisMonth}
- assertVisible: "(?i)${output.jumpedMonth} paychecks"
- takeScreenshot: pro-month-jumped
- tapOn: "Go to this month"
- extendedWaitUntil:
    visible: ${output.thisMonth}
    timeout: 15000

# A paycheck's own pay amount: the sheet opens instead of the paywall, Save closes it
# and the header's Left over (the only amount that is its own element) follows the
# new pay. inputText appends, so erase first.
- tapOn:
    text: "[A-Z]{3}, [0-9]+, .*"
    index: 0
- extendedWaitUntil:
    visible: "Mark all paid"
    timeout: 15000
- copyTextFrom: "-?\\$[0-9,]+\\.[0-9]{2}"
- evalScript: ${output.leftOver = maestro.copiedText}
- tapOn:
    text: "Change .* pay amount for this paycheck"
    index: 0
- extendedWaitUntil:
    visible: "Save"
    timeout: 15000
- eraseText: 10
- inputText: "2100"
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Save"
    timeout: 15000
- copyTextFrom: "-?\\$[0-9,]+\\.[0-9]{2}"
- assertTrue: ${maestro.copiedText != output.leftOver}
- takeScreenshot: pro-pay-amount
- tapOn: "Back"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000

# Another income source: the FAB has no badge and opens the form
- tapOn: "Income"
- extendedWaitUntil:
    visible: "Add income source"
    timeout: 10000
- assertNotVisible: "Add income source · PRO"
- tapOn: "Add income source"
- extendedWaitUntil:
    visible: "e.g. Acme Corp"
    timeout: 10000

# Refund, at the largest accessibility text size: the launch check revokes Pro, so the
# paywall offers Buy again and Restore finds nothing. With that message showing the
# pinned footer is at its tallest (HAU-182): Buy, the message and Restore stay on
# screen while the list scrolls behind them to its last row (CSV).
- launchApp:
    stopApp: true
    arguments:
      "-proStoreMock": true
      "-proStoreMockRevoke": true
      "-UIPreferredContentSizeCategoryName": "UICTContentSizeCategoryAccessibilityXXXL"
- extendedWaitUntil:
    visible: ".*left over.*"
    timeout: 60000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro.*"
    timeout: 15000
- tapOn: "Paycheck Planner Pro.*"
- extendedWaitUntil:
    visible: "Buy for \\$4\\.99"
    timeout: 25000
- tapOn: "Restore Purchases"
- extendedWaitUntil:
    visible: "No Pro purchase found for this account"
    timeout: 15000
- assertNotVisible: "Pro is unlocked"
- repeat:
    times: 4
    commands:
      - swipe:
          start: "50%,45%"
          end: "50%,10%"
          duration: 300
- extendedWaitUntil:
    visible: "Export bills as CSV"
    timeout: 15000
- assertVisible: "Buy for \\$4\\.99"
- assertVisible: "No Pro purchase found for this account"
- assertVisible: "Restore Purchases"
- takeScreenshot: pro-refunded-paywall-xxxl
