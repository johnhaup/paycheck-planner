# Protects the Pro free tier (HAU-69): the 12-month chart, earlier history, per-paycheck amount
# changes, reminders, CSV export and the second income source carry a PRO badge and open the paywall,
# the paywall shows the live store price and Restore Purchases. This flow runs in the release gate on a
# plain Release build, so it must pass without the StoreKit test environment: it never taps Buy.
# The purchase, relaunch and restore steps live in .maestro/pro/purchase.yaml (StoreKit configuration
# required, Xcode run action only; see HAU-78 for making them runnable anywhere).
appId: com.johnhaup.paycheckplanner
name: pro
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000

# Free: this month and next, then a locked column that opens the paywall
- assertVisible: "See a year ahead"
- takeScreenshot: chart-locked
- tapOn: "See a year ahead"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000

# Free: history shows this month only, with a locked row
- scrollUntilVisible:
    element: "Past paychecks"
    direction: DOWN
- tapOn: "Past paychecks"
- extendedWaitUntil:
    visible: "See earlier months"
    timeout: 10000
- tapOn: "See earlier months"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "See earlier months"
    timeout: 10000
- tapOn: "Back"

# Free: Settings shows the Pro row and badges; CSV export opens the paywall
- openLink: paycheck-planner://settings
- extendedWaitUntil:
    visible: "Paycheck Planner Pro, One-time purchase.*"
    timeout: 10000
- assertVisible: "PRO"
- takeScreenshot: settings-pro-badges
- swipe:
    start: "50%,80%"
    end: "50%,25%"
- tapOn: ".*Export bills as CSV.*"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- assertVisible: "Restore Purchases"
- tapOn: "Close"
- extendedWaitUntil:
    visible: ".*Export bills as CSV.*"
    timeout: 10000
- tapOn: "Close"

# Free: two sample sources already exist and stay visible; adding a third is gated
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Per month"
    timeout: 10000
- assertVisible: ".*Brightline Co\\..*"
- assertVisible: ".*Mesa Health.*"
# The FAB folds the badge into its label
- assertVisible: "Add income source · PRO"
- takeScreenshot: income-pro-badge
- tapOn: "Add income source · PRO"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- extendedWaitUntil:
    visible: "Buy for \\$4\\.99"
    timeout: 20000
- assertVisible: "Restore Purchases"
- takeScreenshot: paywall
