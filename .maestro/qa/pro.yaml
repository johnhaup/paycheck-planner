# Protects Pro (HAU-69, HAU-78). First the free tier on the real store: the 12-month chart, earlier
# history, per-paycheck amount changes, reminders, CSV export and the second income source carry a PRO
# badge and open the paywall, which shows the live store price and Restore Purchases; it never taps Buy
# there (a real Buy raises the sandbox sign-in alert on a simctl launch).
# Then the purchase on the mock store (launch argument -proStoreMock, src/services/proStoreMock.ts):
# Restore with nothing bought, Buy, unlocked, still Pro after a relaunch, refund (-proStoreMockRevoke)
# locks it again and Restore after the refund finds nothing. A launch without the argument in between
# stays locked (the mock account never leaks into the real store path). Runs in the release gate
# on a plain Release build: no Xcode, no StoreKit configuration, no account.
appId: com.johnhaup.paycheckplanner
name: pro
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000

# Free: this month and next, then a Go Pro card that opens the paywall
- assertVisible: "Go Pro for .* more months"
- takeScreenshot: chart-locked
- tapOn: "Go Pro for .* more months"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000

# Free: history shows this month only, with a locked row
# Past paychecks is the last row: swipe to the bottom, then wait for it.
# Not scrollUntilVisible: under load it ran out of its 20 s budget with the
# row already on screen (HAU-115, same as settings in HAU-106).
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: "Past paychecks"
    timeout: 15000
- tapOn: "Past paychecks"
- extendedWaitUntil:
    visible: "See earlier months"
    timeout: 10000
- tapOn: "See earlier months"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "See earlier months"
    timeout: 10000
- tapOn: "Back"

# Free: Settings shows the Pro row and badges; CSV export opens the paywall
- openLink: paycheck-planner://settings
- extendedWaitUntil:
    visible: "Paycheck Planner Pro, One-time purchase.*"
    timeout: 10000
- assertVisible: "PRO"
- takeScreenshot: settings-pro-badges
- swipe:
    start: "50%,80%"
    end: "50%,25%"
- tapOn: ".*Export bills as CSV.*"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- assertVisible: "Restore Purchases"
- tapOn: "Close"
- extendedWaitUntil:
    visible: ".*Export bills as CSV.*"
    timeout: 10000
- tapOn: "Close"

# Free: two sample sources already exist and stay visible; adding a third is gated
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Per month"
    timeout: 10000
- assertVisible: ".*Brightline Co\\..*"
- assertVisible: ".*Mesa Health.*"
# The FAB folds the badge into its label
- assertVisible: "Add income source · PRO"
- takeScreenshot: income-pro-badge
- tapOn: "Add income source · PRO"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- extendedWaitUntil:
    visible: "Buy for \\$4\\.99"
    timeout: 20000
- assertVisible: "Restore Purchases"
- takeScreenshot: paywall

# Mock store: start from an empty mock account (revoke) whatever an earlier run left behind
- stopApp
- launchApp:
    clearState: true
    arguments:
      "-proStoreMock": true
      "-proStoreMockRevoke": true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Add income source · PRO"
    timeout: 10000
- tapOn: "Add income source · PRO"
- extendedWaitUntil:
    visible: "Buy for \\$4\\.99"
    timeout: 20000
# Nothing bought yet: Restore finds nothing and the paywall stays locked
- tapOn: "Restore Purchases"
- extendedWaitUntil:
    visible: "No Pro purchase found for this account"
    timeout: 10000
- assertVisible: "Buy for \\$4\\.99"
- tapOn: "Buy for \\$4\\.99"
- extendedWaitUntil:
    visible: "Pro is unlocked"
    timeout: 20000
- takeScreenshot: paywall-unlocked
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Add income source"
    timeout: 10000
- assertNotVisible: "Add income source · PRO"
- tapOn: "Add income source"
- extendedWaitUntil:
    visible: "e.g. Acme Corp"
    timeout: 10000
- takeScreenshot: third-source-form

# Still Pro after a kill and relaunch (the launch check asks the mock account again)
- stopApp
- launchApp:
    arguments:
      "-proStoreMock": true
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 60000
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Add income source"
    timeout: 10000
- assertNotVisible: "Add income source · PRO"
- openLink: paycheck-planner://settings
- extendedWaitUntil:
    visible: "Paycheck Planner Pro.*"
    timeout: 10000
- tapOn: "Paycheck Planner Pro.*"
- extendedWaitUntil:
    visible: "Pro is unlocked"
    timeout: 10000
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Close"
    timeout: 10000
- tapOn: "Close"

# No leak: a launch without the argument asks the real store, which owns nothing, so the mock purchase
# must not unlock Pro there (HAU-78 QA). Never tap Buy here: the real sandbox alert would break later flows.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 60000
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Add income source · PRO"
    timeout: 30000
- takeScreenshot: no-arg-locked

# Back on the mock store the account still owns Pro
- stopApp
- launchApp:
    arguments:
      "-proStoreMock": true
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 60000
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Add income source"
    timeout: 30000
- assertNotVisible: "Add income source · PRO"

# Refund: the launch check revokes Pro, the badge comes back, Restore finds nothing
- stopApp
- launchApp:
    arguments:
      "-proStoreMock": true
      "-proStoreMockRevoke": true
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 60000
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Add income source · PRO"
    timeout: 20000
- takeScreenshot: refunded
- tapOn: "Add income source · PRO"
- extendedWaitUntil:
    visible: "Buy for \\$4\\.99"
    timeout: 20000
- tapOn: "Restore Purchases"
- extendedWaitUntil:
    visible: "No Pro purchase found for this account"
    timeout: 10000
- assertNotVisible: "Pro is unlocked"
- tapOn: "Close"
