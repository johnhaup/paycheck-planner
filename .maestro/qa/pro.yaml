# Protects Pro (HAU-69, HAU-78, HAU-116, HAU-118, HAU-146). First the free tier on the real store: the 12-month chart, earlier
# history, per-paycheck amount changes, reminders, CSV export and the second income source carry a PRO
# badge and open the paywall, which shows the live store price and Restore Purchases; it never taps Buy
# there (a real Buy raises the sandbox sign-in alert on a simctl launch).
# The purchase itself is pro-mock-store.yaml (iOS launch argument -proStoreMock). Runs in the release
# gate on a plain Release build on both platforms: no Xcode, no StoreKit configuration, no account.
appId: com.johnhaup.paycheckplanner
name: pro
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000

# Free: this month and next, then a Go Pro card that opens the paywall
- assertVisible: "Go Pro to plan a full year ahead"
- takeScreenshot: chart-locked
- tapOn: "Go Pro to plan a full year ahead"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000

# Collapsed, the card becomes a pill-high Go Pro banner beside the month pills and still opens the paywall
# (HAU-116, HAU-145). The column's button still spans the faded card under the navigation bar, so tap
# the banner itself by point (third column, just under the bar on the iPhone 17 Pro), as
# large-title.yaml does for the December pill.
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 800
- extendedWaitUntil:
    visible:
      text: "Paychecks"
      rightOf: "\\d{1,2}:\\d{2}.*"
      leftOf: "Settings"
    timeout: 15000
- takeScreenshot: chart-locked-collapsed
- tapOn:
    point: 65%, 15%
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 15000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Paychecks"
    timeout: 15000

# Free: history shows this month only, with a locked row
- scrollUntilVisible:
    element: "Past paychecks"
    direction: DOWN
- tapOn: "Past paychecks"
- extendedWaitUntil:
    visible: "See earlier months"
    timeout: 10000
- tapOn: "See earlier months"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "See earlier months"
    timeout: 10000
# The header back button reads Back on iOS and Navigate up on Android
- tapOn: "Back|Navigate up"

# Free: Settings shows the Pro row and badges; CSV export opens the paywall
- openLink: paycheck-planner://settings
- extendedWaitUntil:
    visible: "Paycheck Planner Pro, One-time purchase.*"
    timeout: 10000
- assertVisible: "PRO"
- takeScreenshot: settings-pro-badges
- swipe:
    start: "50%,80%"
    end: "50%,25%"
- tapOn: ".*Export bills as CSV.*"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- assertVisible: "Restore Purchases"
- tapOn: "Close"
- extendedWaitUntil:
    visible: ".*Export bills as CSV.*"
    timeout: 10000
- tapOn: "Close"

# Free: the expense form's Set-aside option carries a PRO badge and opens the paywall (HAU-146)
- tapOn: "Expenses"
- extendedWaitUntil:
    visible: "Add expense.*"
    timeout: 15000
- tapOn: "Add expense.*"
- extendedWaitUntil:
    visible: "Set-aside.*"
    timeout: 15000
- takeScreenshot: expense-setaside-pro-badge
- tapOn: "Set-aside.*"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 15000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Bill"
    timeout: 15000
- swipe:
    start: "50%,20%"
    end: "50%,90%"
- extendedWaitUntil:
    visible: "Add expense.*"
    timeout: 15000

# Free: two sample sources already exist and stay visible; adding a third is gated
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Per month"
    timeout: 10000
- assertVisible: ".*Brightline Co\\..*"
- assertVisible: ".*Mesa Health.*"
# The FAB folds the badge into its label
- assertVisible: "Add income source · PRO"
- takeScreenshot: income-pro-badge
- tapOn: "Add income source · PRO"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- extendedWaitUntil:
    visible: "Buy for \\$4\\.99"
    timeout: 20000
- assertVisible: "Restore Purchases"
- takeScreenshot: paywall
