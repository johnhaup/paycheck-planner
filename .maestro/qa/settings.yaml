# Protects Settings: appearance switching, the Language picker, and
# Erase all data with Undo from its toast, and the erase returning the app to
# the Welcome screen.
appId: com.johnhaup.paycheckplanner
name: settings
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Hide cents"
    timeout: 10000

# Appearance. A fresh install defaults to Dark. The segments expose
# accessibilityState.selected, so wait for it before each screenshot: under
# load the re-render can land after the tap reports done.
- assertVisible:
    text: "Dark"
    selected: true
- tapOn: "Light"
- extendedWaitUntil:
    visible:
      text: "Light"
      selected: true
    timeout: 15000
- takeScreenshot: settings-light
- tapOn: "Dark"
- extendedWaitUntil:
    visible:
      text: "Dark"
      selected: true
    timeout: 15000
- takeScreenshot: settings-dark
- tapOn: "System"
- extendedWaitUntil:
    visible:
      text: "System"
      selected: true
    timeout: 15000

# Language picker round trip
- tapOn: "Language, .*"
- extendedWaitUntil:
    visible: "English"
    timeout: 10000
- takeScreenshot: language
- tapOn: "English"
- extendedWaitUntil:
    visible: "Language, English.*"
    timeout: 10000

# Erase all data, then Undo from the toast. The "All data erased" toast renders
# over the Settings modal; before HAU-60 the LogBox banner hid every toast from
# Maestro, so this Undo tap also protects HAU-60.
# Erase all data is the last row: swipe to the bottom, then wait for it.
# Not scrollUntilVisible: under gate load its first lookup alone used up the
# 20 s budget and it gave up one swipe short (HAU-106).
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: ".*Erase all data.*"
    timeout: 15000
- tapOn: ".*Erase all data.*"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 15000
- tapOn: "Delete"
# The toast dismisses itself after 4 s: tap Undo the moment it shows, no
# screenshot in between (HAU-102). Even then, under load the Delete tap alone
# can outlast the toast: it took 7.3 s at load ~40, so the Undo wait found
# nothing (HAU-153). The Undo wait and tap are optional so a missed toast
# reaches the retry below instead of failing here (same as pay-date-detail,
# HAU-112).
- extendedWaitUntil:
    visible: "Undo"
    timeout: 15000
    optional: true
- tapOn:
    text: "Undo"
    optional: true
- tapOn: "Close"
# When Undo missed, the data is gone and Welcome is behind the closed modal:
# load the sample data again and repeat erase → Undo, up to 5 times. A broken
# Undo still fails at the "left over" wait below.
- repeat:
    times: 5
    while:
      visible: "Try with sample data"
    commands:
      - extendedWaitUntil:
          notVisible: "Close"
          timeout: 15000
      - tapOn: "Try with sample data"
      - extendedWaitUntil:
          visible: ".* · left over"
          timeout: 15000
      - tapOn: "Settings"
      - extendedWaitUntil:
          visible: "Appearance"
          timeout: 15000
      - swipe:
          start: 50%, 80%
          end: 50%, 20%
      - swipe:
          start: 50%, 80%
          end: 50%, 20%
      - extendedWaitUntil:
          visible: ".*Erase all data.*"
          timeout: 15000
      - tapOn: ".*Erase all data.*"
      - extendedWaitUntil:
          visible: "Delete"
          timeout: 15000
      - tapOn: "Delete"
      - extendedWaitUntil:
          visible: "Undo"
          timeout: 15000
          optional: true
      - tapOn:
          text: "Undo"
          optional: true
      - tapOn: "Close"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- assertVisible: "[A-Z]{3}, [0-9]+, Brightline Co\\..*"

# Erase again and let it stand: Welcome comes back
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 10000
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: ".*Erase all data.*"
    timeout: 15000
- tapOn: ".*Erase all data.*"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 15000
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "Delete"
    timeout: 15000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 10000
- takeScreenshot: erased
