# The settings journey: appearance, the Language picker (with the app
# and the gear's label following the language), the Pro row and the gated CSV export,
# and Erase all data with Undo from its toast, then for good, back to Welcome.
# iOS adds the largest text size.
appId: com.johnhaup.paycheckplanner
name: settings
---
- launchApp:
    clearState: true
    arguments:
      "--initialUrl": ${METRO_URL}
      "-EXDevMenuShowsAtLaunch": "NO"
      "-EXDevMenuShowFloatingActionButton": "NO"
      "-EXDevMenuIsOnboardingFinished": "YES"
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Hide cents"
    timeout: 10000
- assertVisible: "Paycheck Planner Pro, One-time purchase.*"

# Appearance. A fresh install defaults to Dark. The segments expose
# accessibilityState.selected, so wait for it: under load the re-render can land
# after the tap reports done.
- assertVisible:
    text: "Dark"
    selected: true
- tapOn: "Light"
- extendedWaitUntil:
    visible:
      text: "Light"
      selected: true
    timeout: 15000
- takeScreenshot: settings-light

# The Language and Currency sheets have their own X, which goes back to Settings
# without changing the choice (HAU-617).
- tapOn: "Currency, .*"
- extendedWaitUntil:
    visible: "EUR.*"
    timeout: 10000
- assertVisible:
    text: "Close"
    rightOf: "Currency"
- tapOn:
    text: "Close"
    rightOf: "Currency"
- extendedWaitUntil:
    visible: "Currency, System default.*"
    timeout: 10000

# Language: pick Spanish. Settings and the gear's label on Paychecks follow it
# ("Ajustes", HAU-61); "Close" has English only. Then back to English.
- tapOn: "Language, .*"
- extendedWaitUntil:
    visible: "Español"
    timeout: 10000
- assertVisible:
    text: "Close"
    rightOf: "Language"
- tapOn:
    text: "Close"
    rightOf: "Language"
- extendedWaitUntil:
    visible: "Language, System default.*"
    timeout: 10000
- tapOn: "Language, .*"
- extendedWaitUntil:
    visible: "Español"
    timeout: 10000
# A picker row's label and detail are one element (HAU-304): on Android the System
# default row's detail "English" used to be its own node, and `tapOn: "English"` hit it.
# [\s\S] because Android joins the two lines with a newline.
- assertVisible: "System default[\\s\\S]*English[\\s\\S]*"
- tapOn: "Español"
- extendedWaitUntil:
    visible: "Idioma, Español.*"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Ocultar decimales"
    timeout: 10000
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: "Ocultar decimales"
    timeout: 10000
- tapOn: "Idioma, .*"
- extendedWaitUntil:
    visible: "English"
    timeout: 10000
- tapOn: "English"
- extendedWaitUntil:
    visible: "Language, English.*"
    timeout: 10000

# The Data rows are last: swipe to the bottom, then wait (HAU-106).
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: ".*Erase all data.*"
    timeout: 15000

# CSV export is Pro: free opens the paywall (HAU-69)
- tapOn: ".*Export bills as CSV.*"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- assertVisible: "Restore purchases"
- tapOn: "Close"
- extendedWaitUntil:
    visible: ".*Erase all data.*"
    timeout: 10000

# Erase all data, then Undo from the toast, which renders over the Settings modal.
# The toast dismisses itself after 4 s: tap Undo the moment it shows (HAU-102). Under
# load the Delete tap alone can outlast it (HAU-153), so the Undo wait and tap are
# optional and the pair is tried up to 5 times (HAU-112). When Undo missed, the data
# is gone and Welcome is behind the closed modal: load the sample data again and come
# back here. A broken Undo still fails at the check after the loop.
- evalScript: ${output.undone = false}
- repeat:
    times: 5
    while:
      true: ${!output.undone}
    commands:
      - tapOn: ".*Erase all data.*"
      - extendedWaitUntil:
          visible: "Delete"
          timeout: 15000
      - tapOn: "Delete"
      - extendedWaitUntil:
          visible: "Undo"
          timeout: 15000
          optional: true
      - tapOn:
          text: "Undo"
          optional: true
      - tapOn: "Close"
      - runFlow:
          when:
            visible: ".* · left over"
          commands:
            - evalScript: ${output.undone = true}
      - runFlow:
          when:
            true: ${!output.undone}
          commands:
            - tapOn: "Try with sample data"
            - extendedWaitUntil:
                visible: ".* · left over"
                timeout: 15000
            - tapOn: "Settings"
            - extendedWaitUntil:
                visible: "Appearance"
                timeout: 15000
            - swipe:
                start: 50%, 80%
                end: 50%, 20%
            - swipe:
                start: 50%, 80%
                end: 50%, 20%
            - extendedWaitUntil:
                visible: ".*Erase all data.*"
                timeout: 15000
- assertTrue: ${output.undone}
- assertVisible: "[A-Z]{3}, [0-9]+, Brightline Co\\..*"

# Erase again and let it stand: Welcome comes back
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 10000
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: ".*Erase all data.*"
    timeout: 15000
- tapOn: ".*Erase all data.*"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 15000
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "Delete"
    timeout: 15000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 10000
- takeScreenshot: erased

# iOS, largest accessibility text size (HAU-162): the Appearance segments stack, one
# full-width row each, instead of clipping side by side. Maestro
# can assert the stack (each below the one before, never to its right). The launch
# argument lasts for this launch only.
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: true
          arguments:
            "--initialUrl": ${METRO_URL}
            "-EXDevMenuShowsAtLaunch": "NO"
            "-EXDevMenuShowFloatingActionButton": "NO"
            "-EXDevMenuIsOnboardingFinished": "YES"
            "-UIPreferredContentSizeCategoryName": "UICTContentSizeCategoryAccessibilityXXXL"
      - extendedWaitUntil:
          visible: "Plan every paycheck"
          timeout: 60000
      - tapOn: "Settings"
      - extendedWaitUntil:
          visible: "Light"
          timeout: 15000
      - assertVisible:
          text: "Dark"
          below: "Light"
      - assertVisible:
          text: "System"
          below: "Dark"
      - assertNotVisible:
          text: "Dark"
          rightOf: "Light"
      - takeScreenshot: settings-xxxl
