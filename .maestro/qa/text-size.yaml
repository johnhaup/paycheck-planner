# Protects Paychecks at the largest accessibility text size (HAU-131): the hero amount stays one
# element on screen, the chart collapses into the pills with the Go Pro banner, and a bill's amount
# sits below its name instead of beside it (names used to truncate to "G…"). Clipping and wrapping
# cannot be read by Maestro, so read the screenshots too.
# The launch argument sets the text size for this launch only, so no other flow is affected and the
# flow needs nothing from the simulator. The Welcome button is below the fold at this size.
# Taps on rows are left out on purpose: once collapsed, the sticky header's wrapper swallows taps
# on the rows under it (HAU-155); add them here once that is fixed.
# The month chart grows with the amount above the tallest bar, which the horizontal scroll view used
# to cut in half (HAU-156). Read text-size-expanded, text-size-next-month-selected and
# text-size-medium-expanded: "$5k" must be whole and the Go Pro card must reach its top.
appId: com.johnhaup.paycheckplanner
name: text-size
---
- launchApp:
    clearState: true
    arguments:
      "-UIPreferredContentSizeCategoryName": "UICTContentSizeCategoryAccessibilityXXXL"
- extendedWaitUntil:
    visible: "Plan every paycheck"
    timeout: 60000
- scrollUntilVisible:
    element: "Try with sample data"
    direction: DOWN
    timeout: 30000
- swipe:
    start: 50%, 70%
    end: 50%, 50%
    duration: 400
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".*left over.*"
    timeout: 15000
- extendedWaitUntil:
    visible: "Go Pro to plan a full year ahead"
    timeout: 10000
- takeScreenshot: text-size-expanded

# The next month selected: its amount is the tallest and bold. Columns by position, not by month
# name, so the flow does not depend on the run date.
- tapOn:
    text: ".*, \\$.* left"
    index: 1
- extendedWaitUntil:
    visible:
      text: ".*this month.*"
      selected: false
    timeout: 10000
- takeScreenshot: text-size-next-month-selected
- tapOn: ".*this month.*"
- extendedWaitUntil:
    visible:
      text: ".*this month.*"
      selected: true
    timeout: 10000

# Collapsed: the pills and the banner are pinned, and the section header's count stays on screen
- swipe:
    start: 50%, 75%
    end: 50%, 35%
    duration: 500
- extendedWaitUntil:
    visible:
      text: "Paychecks"
      index: 0
    timeout: 10000
- extendedWaitUntil:
    visible: ".* PAYCHECKS"
    timeout: 10000
- takeScreenshot: text-size-collapsed

# Stacked rows: the amount is under the name
- scrollUntilVisible:
    element: "Change Car Registration amount for this paycheck"
    direction: DOWN
    timeout: 45000
- extendedWaitUntil:
    visible:
      text: "Change Car Registration amount for this paycheck"
      below: "Car Registration"
    timeout: 15000
- takeScreenshot: text-size-stacked-row

# The smallest accessibility size clipped the same amount (HAU-156)
- launchApp:
    arguments:
      "-UIPreferredContentSizeCategoryName": "UICTContentSizeCategoryAccessibilityM"
- extendedWaitUntil:
    visible: "Go Pro to plan a full year ahead"
    timeout: 60000
- takeScreenshot: text-size-medium-expanded

# The Income FAB's PRO badge stays a one-line corner tag at the size that first wrapped it (HAU-160).
# Read text-size-income-fab: "PRO" on one line, and the plus icon not covered.
- tapOn: "Income"
- extendedWaitUntil:
    visible: "Add income source · PRO"
    timeout: 15000
- takeScreenshot: text-size-income-fab
