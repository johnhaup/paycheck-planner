# Protects: cold launch, the first-run Welcome, every tab's empty state and sample
# state, the Settings and Pay date round trips, and that data survives a relaunch.
#
# Conventions for every flow in this folder (dev build + Metro on the QA sim):
# - The Settings gear and its close button are icon-only Pressables with
#   accessibility labels (HAU-61), matched by "Settings" and "Close".
# - Tabs are switched on the real tab bar. Before HAU-60 the Reanimated
#   dependencies warning (from sonner-native's toast hooks) raised the LogBox
#   banner over the tab bar after the first toast, invisible to Maestro, and the
#   flows had to use deep links (paycheck-planner://income, //expenses, // for
#   Paychecks); the deep links still work and other flows keep them for jumps.
#   The tab taps after "Try with sample data" below are what protect HAU-60.
appId: com.johnhaup.paycheckplanner
name: smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- takeScreenshot: welcome

# Empty states, reached through the real tab bar
- tapOn: "Income"
- extendedWaitUntil:
    visible: "No income yet"
    timeout: 10000
- takeScreenshot: income-empty
- tapOn: "Expenses"
- extendedWaitUntil:
    visible: "No expenses yet"
    timeout: 10000
- takeScreenshot: expenses-empty
- tapOn: "Paychecks"
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 10000

# Sample budget
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- assertVisible: "[A-Z]{3}, [0-9]+, Brightline Co\\..*"
- takeScreenshot: paychecks

# The sample-data toast is the first toast; the tab bar must stay reachable (HAU-60)
- assertNotVisible: "Open debugger to view warnings."
- tapOn: "Income"
- extendedWaitUntil:
    visible: "Per month"
    timeout: 10000
- assertVisible: ".*Brightline Co\\..*"
- takeScreenshot: income
- tapOn: "Expenses"
- extendedWaitUntil:
    visible: ".* a month across .*"
    timeout: 10000
- assertVisible: ".*Groceries.*"
- takeScreenshot: expenses
- tapOn: "Paychecks"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000

# Settings round trip
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Hide cents"
    timeout: 10000
- takeScreenshot: settings
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Hide cents"
    timeout: 10000

# Pay date round trip
- tapOn:
    text: "[A-Z]{3}, [0-9]+, .*"
    index: 0
- extendedWaitUntil:
    visible: "This paycheck"
    timeout: 10000
- takeScreenshot: pay-date
- tapOn: "Back"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000

# Persisted state survives a kill and relaunch
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 60000
- assertVisible: "[A-Z]{3}, [0-9]+, Brightline Co\\..*"
- takeScreenshot: relaunched
