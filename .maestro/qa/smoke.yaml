# Protects: cold launch, the first-run Welcome, every tab's empty state, the sample
# budget, and that data survives a relaunch. Kept short: it is the first thing to
# read when a build is broken. Everything else is in the journey flows.
#
# The suite is this file plus one flow per main journey (paychecks, income, expenses,
# settings, pro): at most 8 flows, about 5 minutes on one simulator. A new feature
# gets a few steps in the journey it belongs to, never a file of its own; variants
# (Pro, a locale, a text size) are steps too (brain principles.md, 2026-11-14).
#
# Conventions for every flow in this folder:
# - They run in the release gate on a plain Release build launched with simctl.
# - Steps that need iOS (launch arguments for text size, language and the mock
#   store; the collapsing large title) sit in `runFlow: when: platform: iOS`
#   blocks, so the rest of the flow still runs on Android. pro.yaml is iOS only.
# - The Settings gear and its close button are icon-only Pressables with
#   accessibility labels (HAU-61), matched by "Settings" and "Close".
# - No deep links (`openLink`): tabs are switched on the real tab bar, Settings is
#   opened from the gear and the paywall from a gated control. The first openLink
#   on an erased simulator raises iOS's "Open in Paycheck Planner?" alert, which
#   Maestro has to tap before anything else works (HAU-299, HAU-334).
# - No scrollUntilVisible for a known distance: swipe, then wait (HAU-106). Under
#   load its lookups use up its budget with the target already on screen.
# - No `retry` around a bare launchApp: Maestro 2.11.0 retries failed assertions only,
#   and a simulator that refuses the launch fails the flow at once (HAU-511). The
#   gate's re-run of the failed flow is what covers a failed launch.
appId: com.johnhaup.paycheckplanner
name: smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- takeScreenshot: welcome

# Empty states, reached through the real tab bar
- tapOn: "Income"
- extendedWaitUntil:
    visible: "No income yet"
    timeout: 10000
- tapOn: "Expenses"
- extendedWaitUntil:
    visible: "No expenses yet"
    timeout: 10000
- tapOn: "Paychecks"
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 10000

# Sample budget
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- assertVisible: "[A-Z]{3}, [0-9]+, Brightline Co\\..*"
- takeScreenshot: paychecks

# Persisted state survives a kill and relaunch. launchApp stops the app itself, so
# there is no stopApp before it.
- launchApp
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 60000
- assertVisible: "[A-Z]{3}, [0-9]+, Brightline Co\\..*"
- takeScreenshot: relaunched
