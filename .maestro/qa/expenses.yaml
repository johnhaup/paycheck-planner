# The expenses journey: grouped bills with the monthly summary, the All / Recurring /
# One-time filter, sort, the Pro gate on Set-aside (HAU-146) and adding a bill through
# the form. iOS adds the collapsing large title.
#
# No scrollUntilVisible (HAU-106, HAU-497): the form's lower fields sit at its end and
# the rows this flow edits at the list's top or end, so the flow swipes to that end
# (short swipes in the form, above the keyboard) and waits for the element. With
# centerElement it kept swiping at an element that could not move any nearer the centre
# until its 20 s ran out.
appId: com.johnhaup.paycheckplanner
name: expenses
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- tapOn: "Expenses"
- extendedWaitUntil:
    visible: ".* a month across .*"
    timeout: 10000
- assertVisible: ".*Groceries.*"
- takeScreenshot: expenses

# iOS: the large title collapses into the bar on scroll and comes back at the top
# (HAU-11, regression HAU-58). The collapsed title is centred in the bar, between the
# status-bar clock and Sort; the large one never matches that. "Rent" is on screen
# both at the top and after the scroll.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertNotVisible:
          text: "Expenses"
          rightOf: "\\d{1,2}:\\d{2}.*"
          leftOf: "Sort"
          above: ".*Rent.*"
      - swipe:
          start: 50%, 65%
          end: 50%, 15%
          duration: 400
      - assertNotVisible: ".* a month across .*"
      - assertVisible:
          text: "Expenses"
          rightOf: "\\d{1,2}:\\d{2}.*"
          leftOf: "Sort"
          above: ".*Rent.*"
      - swipe:
          start: 50%, 15%
          end: 50%, 65%
          duration: 400
      - swipe:
          start: 50%, 15%
          end: 50%, 65%
          duration: 400
      - extendedWaitUntil:
          visible: ".* a month across .*"
          timeout: 10000
      - assertNotVisible:
          text: "Expenses"
          rightOf: "\\d{1,2}:\\d{2}.*"
          leftOf: "Sort"
          above: ".*Rent.*"

# Filter (the segment comes before the "ONE-TIME" section header in the tree)
- tapOn:
    text: "One-time"
    index: 0
- assertVisible: ".*Car Registration.*"
- assertNotVisible: ".*Groceries.*"
- tapOn: "Recurring"
- assertVisible: ".*Groceries.*"
- assertNotVisible: ".*Car Registration.*"
- tapOn: "All"
- assertVisible: ".*Groceries.*"

# Sort action sheet, opened by the icon-only button's label (HAU-61)
- tapOn: "Sort"
- extendedWaitUntil:
    visible: "Amount, highest first"
    timeout: 15000
- tapOn: "Amount, highest first"
- assertVisible: ".*Groceries.*"

# The form's Set-aside option is Pro: it opens the paywall and the form stays (HAU-146)
- tapOn: "Add expense"
- extendedWaitUntil:
    visible: "e.g. Electric Company"
    timeout: 10000
- tapOn: "Set-aside.*"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 15000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "e.g. Electric Company"
    timeout: 15000

# Add a bill
- tapOn: "e.g. 150.00"
- inputText: "45"
- tapOn: "e.g. Electric Company"
- inputText: "QA Water"
- pressKey: Enter
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- extendedWaitUntil:
    visible: "Add Expense"
    timeout: 15000
- tapOn: "Add Expense"
# The new bill has no linked source, so it lands in the "Not linked" section
# under the two income sources, below the fold on an iPhone 17 Pro. Wait for
# the summary to count it, then swipe to the bottom and wait for the row
# (HAU-65, HAU-132).
- extendedWaitUntil:
    visible: ".* a month across 9 bills"
    timeout: 15000
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: ".*QA Water.*"
    timeout: 15000
- takeScreenshot: expenses-added

# A linked recurring bill takes a due day, shown in its row in place of the schedule
# (HAU-349). Internet is already once a month, so Brightline's total below is unchanged.
# iOS reads the whole row as "I Internet Open payment link for Internet …"; Android has
# "Internet" and the link button as separate elements. Anchored at the start so the tap
# never hits "Open payment link for Internet" (opens the browser on Android, HAU-435).
- swipe:
    start: 50%, 30%
    end: 50%, 80%
- swipe:
    start: 50%, 30%
    end: 50%, 80%
- extendedWaitUntil:
    visible: "(I )?Internet.*"
    timeout: 15000
- tapOn: "(I )?Internet.*"
- extendedWaitUntil:
    visible: "e.g. Electric Company"
    timeout: 10000
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- extendedWaitUntil:
    visible: "e.g. 18"
    timeout: 15000
- tapOn: "e.g. 18"
- inputText: "18"
# The keyboard covers the button, and Maestro counts it visible there; scroll it up first
- swipe:
    start: 50%, 45%
    end: 50%, 20%
- extendedWaitUntil:
    visible: "Update Expense"
    timeout: 15000
- tapOn: "Update Expense"
# iOS reads a row as one element; on Android the name, the schedule and the amount's
# unit are separate text elements, so a regex across them never matches there (HAU-451).
- extendedWaitUntil:
    visible: "(.*Internet.*)?Due the 18th.*"
    timeout: 15000
- takeScreenshot: expenses-due-day

# Clearing the due day brings back the bill's old slot, not every paycheck (HAU-417).
# Tapping the section label drops the number pad without hitting a key.
- tapOn: "(I )?Internet.*"
- extendedWaitUntil:
    visible: "e.g. Electric Company"
    timeout: 10000
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- extendedWaitUntil:
    visible: "18"
    timeout: 15000
- tapOn: "18"
- eraseText: 4
- tapOn: "(?i)linked income source"
# With the due day gone the form grows a "Which paycheck" row; the button is below it
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- extendedWaitUntil:
    visible: "Update Expense"
    timeout: 15000
- tapOn: "Update Expense"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: ".*Internet.*2nd paycheck each month.*monthly.*"
          timeout: 15000
# Android: Car Payment has the same schedule line, above Internet; only Internet's own
# line is below its name.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          notVisible: "Due the 18th"
          timeout: 15000
      - assertVisible:
          text: "2nd paycheck each month"
          below: "Internet"
- assertVisible: "\\$1,477\\.33/mo"

# A linked bill can repeat yearly: First Month appears and the row says "yearly" (HAU-350).
# QA Water goes on Mesa Health, whose total nothing below checks.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: ".*QA Water.*"
    timeout: 15000
- tapOn: ".*QA Water.*"
- extendedWaitUntil:
    visible: "e.g. Electric Company"
    timeout: 10000
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- extendedWaitUntil:
    visible: "Mesa Health"
    timeout: 15000
- tapOn: "Mesa Health"
# Linked, the form grows the due day and How Often; Yearly is at its new end
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- extendedWaitUntil:
    visible: "Yearly"
    timeout: 15000
- tapOn: "Yearly"
- extendedWaitUntil:
    visible: "First Month"
    timeout: 15000
# First Month's chips push the button off the screen
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- swipe:
    start: 50%, 45%
    end: 50%, 15%
- extendedWaitUntil:
    visible: "Update Expense"
    timeout: 15000
- tapOn: "Update Expense"
- extendedWaitUntil:
    visible: "(.*QA Water.*)?yearly.*"
    timeout: 15000
- takeScreenshot: expenses-yearly

# iOS, largest accessibility text size: a source's group header stacks, its monthly
# total below the name, instead of squeezing the name into a one-letter column
# (HAU-363). The data from above survives the relaunch.
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: true
          arguments:
            "-UIPreferredContentSizeCategoryName": "UICTContentSizeCategoryAccessibilityXXXL"
      - extendedWaitUntil:
          visible: ".*left over.*"
          timeout: 60000
      - tapOn: "Expenses"
      - extendedWaitUntil:
          visible: "\\$1,477\\.33/mo"
          timeout: 15000
      - assertVisible:
          text: "\\$1,477\\.33/mo"
          below: "(?i)brightline co\\."
      - takeScreenshot: expenses-xxxl
