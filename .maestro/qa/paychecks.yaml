# Protects the Paychecks tab: the month hero, selecting another month in the
# chart, the "Go to this month" icon, and the Past paychecks screen.
appId: com.johnhaup.paycheckplanner
name: paychecks
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- assertVisible: ".* in · .* assigned"
- assertVisible: ".* paychecks"
# The cards themselves, not just the header: on Android the list once came up empty under the pinned
# header with the data present (HAU-210)
- extendedWaitUntil:
    visible: ".*(Brightline Co\\.|Mesa Health).* of \\d+ paid.*"
    timeout: 15000

# Remember this month's hero label, pick next month's chart column, come back.
# The free tier (HAU-69) shows only this month and next, so the only column
# whose label lacks "(this month)" is next month's.
- copyTextFrom: ".* · left over"
- evalScript: ${output.thisMonth = maestro.copiedText}
- tapOn:
    text: "[A-Za-z]+( [0-9]{4})?, \\$[^,]+ left"
    index: 0
- extendedWaitUntil:
    visible: "Go to this month"
    timeout: 10000
- copyTextFrom: ".* · left over"
- assertTrue: ${maestro.copiedText != output.thisMonth}
- takeScreenshot: paychecks-other-month
- tapOn: "Go to this month"
- extendedWaitUntil:
    visible: ${output.thisMonth}
    timeout: 10000

# Past paychecks is the list's footer: swipe to the bottom, then wait for it.
# Not scrollUntilVisible: under gate load two lookups (5 s each) and two swipes
# (8.5 s each) used up its 20 s budget, and it gave up with the link already on
# screen (HAU-173, same as HAU-106). Three swipes, because the list is longest
# early in a month (up to five paychecks); a swipe at the bottom only bounces.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: "Past paychecks"
    timeout: 15000
- tapOn: "Past paychecks"
- extendedWaitUntil:
    visible: "Back"
    timeout: 10000
- takeScreenshot: past-paychecks
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Past paychecks"
    timeout: 10000
# Back to the top the same way: the month hero comes back under the large title
- swipe:
    start: 50%, 20%
    end: 50%, 80%
- swipe:
    start: 50%, 20%
    end: 50%, 80%
- swipe:
    start: 50%, 20%
    end: 50%, 80%
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 15000
