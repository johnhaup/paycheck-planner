# Protects the Paychecks tab: the month hero, selecting another month in the
# chart, the "Go to this month" icon, and the one list that scrolls through every month.
appId: com.johnhaup.paycheckplanner
name: paychecks
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- assertVisible: ".* in · .* assigned"
- assertVisible: ".* paychecks"
# The cards themselves, not just the header: on Android the list once came up empty under the pinned
# header with the data present (HAU-210)
- extendedWaitUntil:
    visible: ".*(Brightline Co\\.|Mesa Health).* of \\d+ paid.*"
    timeout: 15000

# Remember this month's hero label, pick next month's chart column, come back.
# The free tier (HAU-69) shows only this month and next, so the only column
# whose label lacks "(this month)" is next month's.
- copyTextFrom: ".* · left over"
- evalScript: ${output.thisMonth = maestro.copiedText}
- tapOn:
    text: "[A-Za-z]+( [0-9]{4})?, \\$[^,]+ left"
    index: 0
- extendedWaitUntil:
    visible: "Go to this month"
    timeout: 10000
- copyTextFrom: ".* · left over"
- assertTrue: ${maestro.copiedText != output.thisMonth}
- takeScreenshot: paychecks-other-month
- tapOn: "Go to this month"
- extendedWaitUntil:
    visible: ${output.thisMonth}
    timeout: 10000

# One list runs through every month (HAU-316): scrolling on reaches next month's
# paychecks with no tap, the chart's selected month follows, and where the free
# months end a row opens the paywall instead of more paychecks.
# Swipes, not scrollUntilVisible: under gate load two lookups (5 s each) and two
# swipes (8.5 s each) used up its 20 s budget, and it gave up with the target
# already on screen (HAU-173, same as HAU-106). Three swipes, because the list
# is longest early in a month; a swipe at the bottom only bounces.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: "See a full year of paychecks"
    timeout: 15000
# Next month's column, the only one without "(this month)", is now the selected one
- extendedWaitUntil:
    visible:
      text: "[A-Za-z]+( [0-9]{4})?, \\$[^,]+ left"
      selected: true
    timeout: 15000
- takeScreenshot: paychecks-scrolled-to-next-month
# Back to the top the same way: this month's hero comes back under the large title
- swipe:
    start: 50%, 20%
    end: 50%, 80%
- swipe:
    start: 50%, 20%
    end: 50%, 80%
- swipe:
    start: 50%, 20%
    end: 50%, 80%
- extendedWaitUntil:
    visible: ${output.thisMonth}
    timeout: 15000
