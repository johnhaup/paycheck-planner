# The paychecks and bills journey on the free tier: the month hero and chart, the one
# list that scrolls through every month, the Pro gates where the free months end, and
# the Pay date screen (paid toggles, Mark all paid with Undo). iOS adds the collapsing
# large title with the pinned month pills, and Arabic.
# No step names a month, so the flow passes on any date.
appId: com.johnhaup.paycheckplanner
name: paychecks
env:
  # A month's bar in the chart, or its pill once collapsed: "November (this month), $1.3k left", "January 2027, $5k left"
  MONTH: "[A-Za-z]+( [0-9]{4})?( \\(this month\\))?, -?\\$[0-9.,]+k? left"
  # The same for any month but this one. On the free tier that is next month only.
  OTHER_MONTH: "[A-Za-z]+( [0-9]{4})?, \\$[^,]+ left"
---
- launchApp:
    clearState: true
    arguments:
      "--initialUrl": ${METRO_URL}
      "-EXDevMenuShowsAtLaunch": "NO"
      "-EXDevMenuShowFloatingActionButton": "NO"
      "-EXDevMenuIsOnboardingFinished": "YES"
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- assertVisible: ".* in · .* assigned"
- assertVisible: ".* paychecks"
# The cards themselves, not just the header: on Android the list once came up empty under the pinned
# header with the data present (HAU-210)
- extendedWaitUntil:
    visible: ".*(Brightline Co\\.|Mesa Health).* of \\d+ paid.*"
    timeout: 15000
- copyTextFrom: ".* · left over"
- evalScript: ${output.thisMonth = maestro.copiedText}

# Free shows exactly two months that have paychecks, then the Go Pro card (HAU-329).
# pro.yaml buys from that card.
- assertVisible: "Go Pro to plan a full year ahead"
- assertVisible:
    text: ${MONTH}
    index: 1
- assertNotVisible:
    text: ${MONTH}
    index: 2
# iOS: the large title collapses into the bar and the month chart into pills pinned
# under it (HAU-11, HAU-12, HAU-113; both regressed once on an SDK upgrade, HAU-58).
# Maestro cannot read font sizes, but the collapsed title is centred in the bar: right
# of the status-bar clock and left of the gear. The large title is left-aligned under
# the clock and never matches that.
- runFlow:
    when:
      platform: iOS
    commands:
      # The list opens on the paycheck nearest today. With this month's past paychecks
      # above it (sample data: after the 15th) it opens scrolled, the title already
      # collapsed. Note which, for the tab return below, then scroll to the top (HAU-328).
      - evalScript: ${output.openedAtTop = false}
      - runFlow:
          when:
            notVisible:
              text: "Paychecks"
              rightOf: "\\d{1,2}:\\d{2}.*"
              leftOf: "Settings"
              above: ".* · left over"
          commands:
            - evalScript: ${output.openedAtTop = true}
      - swipe:
          start: 50%, 35%
          end: 50%, 90%
      - swipe:
          start: 50%, 35%
          end: 50%, 90%
      - waitForAnimationToEnd
      - assertNotVisible:
          text: "Paychecks"
          rightOf: "\\d{1,2}:\\d{2}.*"
          leftOf: "Settings"
          above: ".* · left over"
      - swipe:
          start: 50%, 65%
          end: 50%, 15%
          duration: 400
      - waitForAnimationToEnd
      - assertNotVisible: ".* · left over"
      # Scrolling back a little, short of the top, leaves it collapsed (HAU-854)
      - swipe:
          start: 50%, 40%
          end: 50%, 52%
          duration: 600
      - waitForAnimationToEnd
      - assertNotVisible: ".* · left over"
      - assertVisible:
          text: ${MONTH}
          selected: true
      # The tab bar's own "Paychecks" label also passes rightOf/leftOf, with the title
      # collapsed or not; it is the selected tab, the bar title never is (HAU-337 QA).
      - assertVisible:
          text: "Paychecks"
          rightOf: "\\d{1,2}:\\d{2}.*"
          leftOf: "Settings"
          selected: false
      - takeScreenshot: paychecks-collapsed
      # The selected pill jumps back to the top, under the expanded large title, not the
      # collapsed one (HAU-630)
      - tapOn:
          text: ${MONTH}
          selected: true
      - waitForAnimationToEnd
      - assertVisible: ".* · left over"
      - assertNotVisible:
          text: "Paychecks"
          rightOf: "\\d{1,2}:\\d{2}.*"
          leftOf: "Settings"
          above: ".* · left over"

# One list runs through every month (HAU-316): scrolling on reaches next month's
# paychecks with no tap, the chart's selected month follows, and where the free
# months end a row opens the paywall instead of more paychecks.
# Four swipes from the top: early in a month the list is longest, and late in one it
# starts with this month's past paychecks. A swipe at the bottom only bounces.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: "See a full year of paychecks"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: ${OTHER_MONTH}
      selected: true
    timeout: 15000
- tapOn: "See a full year of paychecks"
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "See a full year of paychecks"
    timeout: 10000

# Leaving the tab and coming back opens on the current paycheck again (HAU-25,
# HAU-316), on iOS under the large title when that paycheck is the list's first
- tapOn: "Income"
- extendedWaitUntil:
    visible: "Per month"
    timeout: 10000
- tapOn: "Paychecks"
- extendedWaitUntil:
    visible: ${output.thisMonth}
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Go to this month"
    timeout: 10000
- runFlow:
    when:
      platform: iOS
      true: ${output.openedAtTop}
    commands:
      - assertNotVisible:
          text: "Paychecks"
          rightOf: "\\d{1,2}:\\d{2}.*"
          leftOf: "Settings"
          above: ".* · left over"

# Another month's chart column changes the hero; "Go to this month" comes back. The
# first column not selected: next month mid-month, but after the month's last paycheck
# home is next month and the other column is this month, to its left (HAU-328).
- tapOn:
    text: ${MONTH}
    selected: false
- extendedWaitUntil:
    visible: "Go to this month"
    timeout: 10000
- copyTextFrom: ".* · left over"
- assertTrue: ${maestro.copiedText != output.thisMonth}
- tapOn: "Go to this month"
- extendedWaitUntil:
    visible: ${output.thisMonth}
    timeout: 10000

# Pay date: the next Brightline paycheck, the one the sample data puts Internet on.
# By name, not the first card: after the 15th the list starts with this month's past
# Mesa Health paychecks, out of sight above the current one (HAU-328). When today is
# a Mesa payday (2026-11-30) that card sits low enough that its centre is under the
# floating tab bar and the tap opens Income, so bring it to mid-screen first.
- scrollUntilVisible:
    element:
      text: "[A-Z]{3}, [0-9]+, Brightline Co\\..*"
      index: 0
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    text: "[A-Z]{3}, [0-9]+, Brightline Co\\..*"
    index: 0
- extendedWaitUntil:
    visible: "This paycheck"
    timeout: 10000
- assertVisible: "Left over"
- assertVisible: "Available"
- takeScreenshot: pay-date

# Toggle one bill paid and back. Name the bill: "Mark .* paid" also matches the
# header's "Mark all paid" (HAU-112).
- tapOn: "Mark Internet paid"
- extendedWaitUntil:
    visible: "Mark Internet unpaid"
    timeout: 15000
- tapOn: "Mark Internet unpaid"
- extendedWaitUntil:
    visible: "Mark Internet paid"
    timeout: 15000

# Mark all paid, then undo from the toast. The toast dismisses itself after 4 s, so
# nothing may sit between seeing Undo and tapping it (HAU-102), and under gate load
# Maestro's own tap and lookup can still outlast it (HAU-112): the Undo wait and tap
# are optional, and the pair is tried up to 5 times. When Undo missed, every bill is
# paid and "Mark all paid" is hidden, so unpay one bill to bring it back. A broken
# Undo still fails at the wait after the loop.
- evalScript: ${output.undone = false}
- repeat:
    times: 5
    while:
      true: ${!output.undone}
    commands:
      - tapOn: "Mark all paid"
      - extendedWaitUntil:
          visible: "Undo"
          timeout: 15000
          optional: true
      - tapOn:
          text: "Undo"
          optional: true
      - runFlow:
          when:
            visible: "Mark all paid"
          commands:
            - evalScript: ${output.undone = true}
      - runFlow:
          when:
            true: ${!output.undone}
          commands:
            - tapOn:
                text: "Mark .* unpaid"
                index: 0
            - extendedWaitUntil:
                visible: "Mark all paid"
                timeout: 15000
- assertTrue: ${output.undone}

# Changing this paycheck's pay amount is Pro (HAU-69): the paywall, not the sheet
- tapOn:
    text: "Change .* pay amount for this paycheck"
    index: 0
- extendedWaitUntil:
    visible: "Paycheck Planner Pro"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Mark all paid"
    timeout: 10000
# The header back button reads Back on iOS and Navigate up on Android
# Back on the list, scrolled to that card: the hero may be out of view, but the
# selected month (bar, or pill under a collapsed title) is always there.
- tapOn: "Back|Navigate up"
- extendedWaitUntil:
    notVisible: "Mark all paid"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ${MONTH}
      selected: true
    timeout: 10000

# iOS variant. The launch argument lasts for one launch and the data stays.
- runFlow:
    when:
      platform: iOS
    commands:
      # Arabic device language: the app comes up translated, and a chart amount keeps its
      # number, "k" and currency together between direction marks (HAU-154), and ends with a
      # left-to-right mark so "US$" reads as one unit, not "$US" (HAU-789). The marks are in
      # the pattern below. Display order is a screenshot check.
      - launchApp:
          stopApp: true
          arguments:
            "--initialUrl": ${METRO_URL}
            "-EXDevMenuShowsAtLaunch": "NO"
            "-EXDevMenuShowFloatingActionButton": "NO"
            "-EXDevMenuIsOnboardingFinished": "YES"
            "-AppleLanguages": "(ar)"
      - extendedWaitUntil:
          visible: ".*، المتبقي \u200F[0-9.,]+k?\u200F\u00A0US\\$\u200E"
          timeout: 60000
      # The layout is mirrored too: the tab bar runs right to left, Paychecks rightmost.
      # An app that declares no languages (no CFBundleLocalizations) stays LTR here (HAU-365).
      - assertVisible:
          text: "الرواتب"
          rightOf: "الدخل"
      - assertVisible:
          text: "الدخل"
          rightOf: "المصروفات"
      - takeScreenshot: paychecks-arabic
      # Japanese: the date tile shows the day as a bare number under the month ("11月 / 20"),
      # not "20日", which wrapped onto two lines in the tile (HAU-364). The card's label
      # starts with the tile's two lines. One line in the tile is a screenshot check.
      - launchApp:
          stopApp: true
          arguments:
            "--initialUrl": ${METRO_URL}
            "-EXDevMenuShowsAtLaunch": "NO"
            "-EXDevMenuShowFloatingActionButton": "NO"
            "-EXDevMenuIsOnboardingFinished": "YES"
            "-AppleLanguages": "(ja)"
      - extendedWaitUntil:
          visible: "\\d{1,2}月, \\d{1,2}, .*"
          timeout: 60000
      - assertNotVisible: "\\d{1,2}月, \\d{1,2}日, .*"
      - takeScreenshot: paychecks-japanese
