appId: com.johnhaup.paycheckplanner
tags: [ios]   # the mock store is switched on by an iOS launch argument (Android reads every launch flag as off)
name: pro-mock-store
# Protects the Pro purchase on the mock store (launch argument -proStoreMock, src/services/proStoreMock.ts):
# Restore with nothing bought, Buy, unlocked, still Pro after a relaunch, refund (-proStoreMockRevoke)
# locks it again and Restore after the refund finds nothing. A launch without the argument in between
# stays locked (the mock account never leaks into the real store path). The free tier is pro.yaml.
---
# Mock store: start from an empty mock account (revoke) whatever an earlier run left behind
- stopApp
- launchApp:
    clearState: true
    arguments:
      "-proStoreMock": true
      "-proStoreMockRevoke": true
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 60000
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 10000
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Add income source · PRO"
    timeout: 10000
- tapOn: "Add income source · PRO"
- extendedWaitUntil:
    visible: "Buy for \\$4\\.99"
    timeout: 20000
# Nothing bought yet: Restore finds nothing and the paywall stays locked
- tapOn: "Restore Purchases"
- extendedWaitUntil:
    visible: "No Pro purchase found for this account"
    timeout: 10000
- assertVisible: "Buy for \\$4\\.99"
- tapOn: "Buy for \\$4\\.99"
- extendedWaitUntil:
    visible: "Pro is unlocked"
    timeout: 20000
- takeScreenshot: paywall-unlocked
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Add income source"
    timeout: 10000
- assertNotVisible: "Add income source · PRO"
- tapOn: "Add income source"
- extendedWaitUntil:
    visible: "e.g. Acme Corp"
    timeout: 10000
- takeScreenshot: third-source-form

# Still Pro after a kill and relaunch (the launch check asks the mock account again)
- stopApp
- launchApp:
    arguments:
      "-proStoreMock": true
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 60000
# Pro's 12 months collapse into a row of 52pt pills pinned under the bar (HAU-118); the
# third one switches month. Tapped by point like large-title.yaml's December pill (third
# column, just under the bar on the iPhone 17 Pro). Like that flow, the month names assume
# a November run date ("January 2027": months outside this year carry the year).
- swipe:
    start: 50%, 65%
    end: 50%, 15%
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Paychecks"
      rightOf: "\\d{1,2}:\\d{2}.*"
      leftOf: "Settings"
    timeout: 15000
- tapOn:
    point: 39%, 15%
- extendedWaitUntil:
    visible:
      text: "January.*"
      selected: true
    timeout: 15000
- takeScreenshot: pro-pills-pinned
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Add income source"
    timeout: 10000
- assertNotVisible: "Add income source · PRO"
- openLink: paycheck-planner://settings
- extendedWaitUntil:
    visible: "Paycheck Planner Pro.*"
    timeout: 10000
- tapOn: "Paycheck Planner Pro.*"
- extendedWaitUntil:
    visible: "Pro is unlocked"
    timeout: 10000
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Close"
    timeout: 10000
- tapOn: "Close"

# No leak: a launch without the argument asks the real store, which owns nothing, so the mock purchase
# must not unlock Pro there (HAU-78 QA). Never tap Buy here: the real sandbox alert would break later flows.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 60000
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Add income source · PRO"
    timeout: 30000
- takeScreenshot: no-arg-locked

# Back on the mock store the account still owns Pro
- stopApp
- launchApp:
    arguments:
      "-proStoreMock": true
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 60000
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Add income source"
    timeout: 30000
- assertNotVisible: "Add income source · PRO"

# Refund: the launch check revokes Pro, the badge comes back, Restore finds nothing
- stopApp
- launchApp:
    arguments:
      "-proStoreMock": true
      "-proStoreMockRevoke": true
- extendedWaitUntil:
    visible: ".* · left over"
    timeout: 60000
- openLink: paycheck-planner://income
- extendedWaitUntil:
    visible: "Add income source · PRO"
    timeout: 20000
- takeScreenshot: refunded
- tapOn: "Add income source · PRO"
- extendedWaitUntil:
    visible: "Buy for \\$4\\.99"
    timeout: 20000
- tapOn: "Restore Purchases"
- extendedWaitUntil:
    visible: "No Pro purchase found for this account"
    timeout: 10000
- assertNotVisible: "Pro is unlocked"
- tapOn: "Close"
