# Store screenshots. iOS: bun store:screenshots, then bun store:screenshots:sizes for the 6.5" set. Google Play:
# add --android. Needs a build with EXPO_PUBLIC_STORE_DEMO=1, where paycheck-planner://demo loads the store
# sample budget with Pro on (pass --build once).
# On a dev build instead: start a Metro with that flag (EXPO_PUBLIC_STORE_DEMO=1 bunx expo start --dev-client
# --port 8096), set the status bar (xcrun simctl status_bar <udid> override --time 9:41 ...), run
#   maestro --udid <udid> test -e METRO_URL=http://127.0.0.1:8096 ship/screenshots.yaml --test-output-dir <tmp>
# and copy <tmp>/**/takeScreenshot/*.png to ship/screenshots/raw. A Release build ignores METRO_URL and the
# -EXDevMenu* arguments.
# Every label the flow taps or waits for is a variable holding the English text as a regex. The iPhone Duo script
# (scripts/duo-screenshots.mjs) passes another language's from its locale file, with LANGUAGE set to that language.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.johnhaup.paycheckplanner"}
  METRO_URL: ${METRO_URL || ""}
  LANGUAGE: ${LANGUAGE || "en"}
  TRY_SAMPLE: ${TRY_SAMPLE || "Try with sample data"}
  THIS_PAYCHECK: ${THIS_PAYCHECK || "This paycheck"}
  CHANGE_INTERNET: ${CHANGE_INTERNET || "Change Internet amount for this paycheck"}
  PAYCHECK_ONLY: ${PAYCHECK_ONLY || ".*paycheck only"}
  SAVE: ${SAVE || "Save"}
  BACK: ${BACK || "Back"}
  EXPENSES: ${EXPENSES || "Expenses"}
  EMERGENCY_FUND: ${EMERGENCY_FUND || ".*Emergency fund.*"}
  INCOME: ${INCOME || "Income"}
  NEXT_PAYDAY: ${NEXT_PAYDAY || "Next payday"}
  MESA_ROW: ${MESA_ROW || ".*Mesa Health.*per check"}
  ADJUST_TO_WORKDAY: ${ADJUST_TO_WORKDAY || "Adjust to workday"}
  CLOSE: ${CLOSE || "Close"}
  SHORT: ${SHORT || ".*is short by.*"}
  MOVE_BILL: ${MOVE_BILL || "Move a bill"}
  TO_PAYCHECK: ${TO_PAYCHECK || "To paycheck"}
  CAR_REPAIR: ${CAR_REPAIR || "Car repair · .*"}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
    arguments:
      "--initialUrl": ${METRO_URL}
      "-EXDevMenuShowsAtLaunch": "NO"
      "-EXDevMenuShowFloatingActionButton": "NO"
      "-EXDevMenuIsOnboardingFinished": "YES"
      "-AppleLanguages": "(${LANGUAGE})"
# Android drops a link that arrives before the first screen is up
- extendedWaitUntil:
    visible: ${TRY_SAMPLE}
    timeout: 120000
- openLink: paycheck-planner://demo
# iOS asks before a link opens the app
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: ".*Brightline Co\\..*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: paychecks

# The card's own label (date tile, name, ...; iOS joins them with the language's comma); the pay amount inside it
# is a second button (per-paycheck amount)
- tapOn:
    text: ".*[,،、] ?Brightline Co\\.[,،、].*"
    index: 0
- extendedWaitUntil:
    visible: ${THIS_PAYCHECK}
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: detail

- tapOn: ${CHANGE_INTERNET}
- extendedWaitUntil:
    visible: ${PAYCHECK_ONLY}
    timeout: 5000
- eraseText
- inputText: "84.99"
- waitForAnimationToEnd
- takeScreenshot: amount
- tapOn: ${SAVE}
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${BACK}
- runFlow:
    when:
      platform: Android
    commands:
      - back

# Set-asides lead the list, each with its savings goal
- tapOn: ${EXPENSES}
- extendedWaitUntil:
    visible: ${EMERGENCY_FUND}
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: goals

# Slowly, so the list stops where the finger does: the first linked bills under the bar, the last bill above the tabs
- swipe:
    start: 50%, 70%
    end: 50%, 26%
    duration: 2000
# Twice: the scroll indicator fades a moment after the list stops
- waitForAnimationToEnd
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: expenses

- tapOn: ${INCOME}
# On the iPhone Duo's cover a tap straight after the tab change is dropped: let the tab settle first
- extendedWaitUntil:
    visible: ${NEXT_PAYDAY}
    timeout: 5000
- waitForAnimationToEnd
# The form shows every pay schedule; the row is one element (tile letter, name, schedule, amount)
- tapOn:
    text: ${MESA_ROW}
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: ${ADJUST_TO_WORKDAY}
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: income
- tapOn: ${CLOSE}

# A surprise car repair leaves the next Mesa Health paycheck short
- openLink: paycheck-planner://demo?short=1
- extendedWaitUntil:
    visible: ${SHORT}
    timeout: 15000
- tapOn: ${SHORT}
- waitForAnimationToEnd
# On the iPhone Duo's cover the card's Move a bill row is below the fold after the scroll
- scrollUntilVisible:
    element: ${MOVE_BILL}
    direction: DOWN
- tapOn: ${MOVE_BILL}
- extendedWaitUntil:
    visible: ${TO_PAYCHECK}
    timeout: 5000
- tapOn: ${CAR_REPAIR}
# The Brightline paycheck after the next one
- tapOn:
    text: ".* · Brightline Co\\."
    index: 1
- waitForAnimationToEnd
- takeScreenshot: move
