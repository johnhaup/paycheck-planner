# Store screenshots. iOS: bun store:screenshots, then bun store:screenshots:sizes for the 6.5" set. Google Play:
# bun store:play phone (scripts/play-assets.mjs, on the Linux worker; tablets use ship/screenshots-tablet.yaml).
# Needs a build with EXPO_PUBLIC_STORE_DEMO=1, where paycheck-planner://demo loads the store sample budget with
# Pro on (pass --build once).
# On a dev build instead: start a Metro with that flag (EXPO_PUBLIC_STORE_DEMO=1 bunx expo start --dev-client
# --port 8096), set the status bar (xcrun simctl status_bar <udid> override --time 9:41 ...), run
#   maestro --udid <udid> test -e METRO_URL=http://127.0.0.1:8096 ship/screenshots.yaml --test-output-dir <tmp>
# and copy <tmp>/**/takeScreenshot/*.png to ship/screenshots/raw. A Release build ignores METRO_URL and the
# -EXDevMenu* arguments.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || "com.johnhaup.paycheckplanner"}
  METRO_URL: ${METRO_URL || ""}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
    arguments:
      "--initialUrl": ${METRO_URL}
      "-EXDevMenuShowsAtLaunch": "NO"
      "-EXDevMenuShowFloatingActionButton": "NO"
      "-EXDevMenuIsOnboardingFinished": "YES"
# Android drops a link that arrives before the first screen is up
- extendedWaitUntil:
    visible: "Try with sample data"
    timeout: 120000
- openLink: paycheck-planner://demo
# iOS asks before a link opens the app
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: ".*Brightline Co\\..*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: paychecks

# The card's own label; the pay amount inside it is a second button (per-paycheck amount)
- tapOn:
    text: "[A-Z]{3}, [0-9]+, Brightline Co.*"
    index: 0
- extendedWaitUntil:
    visible: "This paycheck"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: detail

- tapOn: "Change Internet amount for this paycheck"
- extendedWaitUntil:
    visible: ".*paycheck only"
    timeout: 5000
- eraseText
- inputText: "84.99"
- waitForAnimationToEnd
- takeScreenshot: amount
- tapOn: "Save"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Back"
- runFlow:
    when:
      platform: Android
    commands:
      # A system back straight after Save only closes the keyboard, and a tap while the sheet closes is dropped
      - extendedWaitUntil:
          notVisible: ".*paycheck only"
          timeout: 5000
      - waitForAnimationToEnd
      - tapOn:
          text: "Back|Navigate up"
          retryTapIfNoChange: true

# Set-asides lead the list, each with its savings goal
- tapOn: "Expenses"
- extendedWaitUntil:
    visible: ".*Emergency fund.*"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: goals

# Slowly, so the list stops where the finger does: the first linked bills under the bar, the last bill above the tabs
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 26%
          duration: 2000
# Android's list starts lower, under an opaque toolbar: a shorter swipe brings the Brightline heading under it
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 36%
          duration: 2000
# Twice: the scroll indicator fades a moment after the list stops
- waitForAnimationToEnd
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: expenses

- tapOn: "Income"
# On the iPhone Duo's cover a tap straight after the tab change is dropped: let the tab settle first
- extendedWaitUntil:
    visible: "Next payday"
    timeout: 5000
- waitForAnimationToEnd
# The form shows every pay schedule; the row is one element (tile letter, name, schedule, amount)
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: ".*Mesa Health.*per check"
          retryTapIfNoChange: true
# Android reads each text of the row on its own
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Mesa Health"
- extendedWaitUntil:
    visible: "Adjust to workday"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: income
- tapOn: "Close"

# A surprise car repair leaves the next Mesa Health paycheck short
- openLink: paycheck-planner://demo?short=1
- extendedWaitUntil:
    visible: ".*is short by.*"
    timeout: 15000
- tapOn: ".*is short by.*"
- waitForAnimationToEnd
# On the iPhone Duo's cover the card's Move a bill row is below the fold after the scroll
- scrollUntilVisible:
    element: "Move a bill"
    direction: DOWN
- tapOn: "Move a bill"
- extendedWaitUntil:
    visible: "To paycheck"
    timeout: 5000
- tapOn: "Car repair · .*"
# The Brightline paycheck after the next one
- tapOn:
    text: ".* · Brightline Co\\."
    index: 1
- waitForAnimationToEnd
- takeScreenshot: move
