# Store screenshots. iOS: bun store:screenshots. Google Play: add --android to capture and frame.
# Needs a build with EXPO_PUBLIC_STORE_DEMO=1 so paycheck-planner://demo loads sample data with Pro on (pass --build once).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
# Android drops a link that arrives before the first screen is up
- extendedWaitUntil:
    visible: "Paychecks"
    timeout: 30000
- openLink: paycheck-planner://demo
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: ".*Brightline Co\\..*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: paychecks

- tapOn: "Expenses"
- extendedWaitUntil:
    visible: ".*Rent.*"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: expenses

- tapOn: "Income"
- extendedWaitUntil:
    visible: ".*Per month.*"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: income

- tapOn: "Paychecks"
- scrollUntilVisible:
    element: ".*Mesa Health.*"
    centerElement: true
# The card's own label; the pay amount inside it is a second button (per-paycheck amount)
- tapOn:
    text: "[A-Z]{3}, [0-9]+, Mesa Health.*"
    index: 0
- extendedWaitUntil:
    visible: "This paycheck"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: detail

- tapOn: "Change Electric amount for this paycheck"
- extendedWaitUntil:
    visible: ".*paycheck only"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: amount
